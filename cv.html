<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV - Gerlinde Theunissen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #222;
      --ink-soft: #555;
      --ink-muted: #888;
      --bg: #fff;
      --surface: #f5f5f4;
      --accent: #2a6496;
      --rule: #e5e5e3;
    }

    html { font-size: 16px; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .page { min-height: 100vh; }

    .site-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 2rem;
      max-width: 1180px;
      margin: 0 auto;
      padding: 1.25rem 2.5rem;
    }
    .site-header__brand {
      color: var(--ink);
      font-size: .95rem;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .site-header__brand:hover { text-decoration: none; }
    .site-header nav { display: flex; align-items: center; justify-content: flex-end; gap: 1.25rem; }
    .site-header nav a {
      color: var(--ink-soft);
      font-size: .76rem;
      text-decoration: none;
      white-space: nowrap;
    }
    .site-header nav a:hover,
    .site-header nav a[aria-current="page"] { color: var(--ink); }

    .main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 3rem 2.5rem 5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: .9rem;
    }

    p {
      font-size: .88rem;
      margin-bottom: .85rem;
      max-width: 58ch;
      color: var(--ink-soft);
    }

    .pdf-container {
      width: 100%;
      max-width: 1000px;
      height: 760px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 1rem;
      background: var(--surface);
    }

    .pdf-container embed {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      .site-header {
        align-items: flex-start;
        flex-direction: column;
        gap: .8rem;
        padding: 1.2rem;
      }
      .site-header nav {
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: .55rem 1rem;
      }
      .main { padding: 1.6rem 1.2rem 3rem; }
      .pdf-container { height: 620px; }
    }
  </style>
</head>
<body>

<div class="page">
  <header class="site-header">
    <a class="site-header__brand" href="/index.html">Gerlinde Theunissen</a>
    <nav>
      <a href="/publications.html">Publications</a>
      <a href="/projects.html">Projects</a>
      <a href="/data.html">Data and Code</a>
      <a href="/talks.html">Talks</a>
      <a href="/cv.html">CV</a>
    </nav>
  </header>

  <main class="main">
    <h1>Curriculum Vitae</h1>
    <p>October 2024</p>

    <div class="pdf-container">
      <embed src="resumewebsite.pdf" type="application/pdf" width="100%" height="100%">
    </div>

    <p><a href="resumewebsite.pdf" target="_blank">Open in new tab</a></p>
  </main>
</div>

</body>
</html>
