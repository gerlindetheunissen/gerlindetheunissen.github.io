<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV - Gerlinde Theunissen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #222;
      --ink-soft: #555;
      --ink-muted: #888;
      --bg: #fff;
      --surface: #f5f5f4;
      --accent: #2a6496;
      --rule: #e5e5e3;
    }

    html { font-size: 16px; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      padding: 2.4rem 1.4rem;
      border-right: 1px solid var(--rule);
      position: sticky;
      top: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .sidebar__portrait {
      width: 100%;
      max-width: 190px;
      aspect-ratio: 1;
      object-fit: cover;
      object-position: center 12%;
      border-radius: 8px;
      margin: 0 auto 1.1rem;
      display: block;
    }

    .sidebar__name {
      font-size: .95rem;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
      margin-bottom: .25rem;
    }

    .sidebar__role {
      font-size: .72rem;
      color: var(--ink-muted);
      line-height: 1.5;
      margin-bottom: 1.6rem;
    }

    .sidebar nav { display: flex; flex-direction: column; gap: .1rem; }

    .sidebar nav a {
      font-size: .8rem;
      font-weight: 400;
      color: var(--ink-soft);
      text-decoration: none;
      padding: .4rem .55rem;
      border-radius: 5px;
      transition: background .12s, color .12s;
    }

    .sidebar nav a:hover {
      background: var(--surface);
      color: var(--ink);
    }

    .main {
      padding: 3rem 3rem 5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: .9rem;
    }

    p {
      font-size: .88rem;
      margin-bottom: .85rem;
      max-width: 58ch;
      color: var(--ink-soft);
    }

    .pdf-container {
      width: 100%;
      max-width: 1000px;
      height: 760px;
      border: 1px solid var(--rule);
      border-radius: 8px;
      overflow: hidden;
      margin-top: 1rem;
      background: var(--surface);
    }

    .pdf-container embed {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    @media (max-width: 700px) {
      .page { grid-template-columns: 1fr; }
      .sidebar {
        position: relative;
        height: auto;
        border-right: none;
        border-bottom: 1px solid var(--rule);
        flex-direction: row;
        flex-wrap: wrap;
        gap: 1rem;
        padding: 1.2rem;
        align-items: start;
      }
      .sidebar__portrait { width: 80px; border-radius: 5px; margin: 0; }
      .sidebar__info { flex: 1; min-width: 130px; }
      .sidebar nav { flex-direction: row; flex-wrap: wrap; width: 100%; gap: .15rem; }
      .main { padding: 1.6rem 1.2rem 3rem; }
      .pdf-container { height: 620px; }
    }
  </style>
</head>
<body>

<div class="page">
  <aside class="sidebar">
    <a href="/index.html">
      <img class="sidebar__portrait" src="fav.png" alt="Gerlinde Theunissen">
    </a>
    <div class="sidebar__info">
      <div class="sidebar__name">Gerlinde Theunissen</div>
      <div class="sidebar__role">
        Postdoc · ETH Zürich SPUR<br>
        Project Leader · Sotomo
      </div>
    </div>
    <nav>
      <a href="/publications.html">Publications</a>
      <a href="/projects.html">Projects</a>
      <a href="/data.html">Data and Code</a>
      <a href="/talks.html">Talks</a>
      <a href="/cv.html">CV</a>
    </nav>
  </aside>

  <main class="main">
    <h1>Curriculum Vitae</h1>
    <p>October 2024</p>

    <div class="pdf-container">
      <embed src="resumewebsite.pdf" type="application/pdf" width="100%" height="100%">
    </div>

    <p><a href="resumewebsite.pdf" target="_blank">Open in new tab</a></p>
  </main>
</div>

</body>
</html>
